<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحتي الأولى</title>

  <style>
    body {
  font-family: Arial, sans-serif;
  background-color: #f6f2fa; /* لون خلفية الصفحة */
  color: #333333;            /* لون الفقرات والنص العادي */
  text-align: center;
  margin: 40px;
}

h1 {
  color: #aa1e17; /* العنوان الرئيسي */
}

h2 {
  color: #1769aa; /* عنوان «عنّي» */
}

a {
  color: #d30035; /* الرابط */
  text-decoration: none;
}

a:hover {
  color: #7a0020; /* لون الرابط عند تمرير المؤشر */
  text-decoration: underline;
}
.gallery img {
  width: 500px;
  height: 300px;
  object-fit: cover;
  border-radius: 300px;
}
  </style>
</head>
<body>
  <header>
  <h1>موقع إلكتروني</h1>
</header>

<main>
  <section>
    <div class="gallery">
      <img src="photo.jpg" alt="صورة لحديقة">
      <p>تصوير</p>
    </div>

    <div class="gallery">
      <img src="photo1.jpg" alt="صورة ثانية">
      <p>تسويق</p>
    </div>

    <div class="gallery">
      <img src="photo2.jpg" alt="صورة ثالثة">
      <p>تصوير احترافي</p>
    </div>

    <div class="gallery">
      <img src="photo3.jpg" alt="صورة رابعة">
      <p>iPhone</p>
    </div>
  </section>
</main>
</body>
</html>
